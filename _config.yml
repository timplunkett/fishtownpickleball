# Site settings for fishtownpickleball.com.
#
# This file is NOT reloaded automatically by `bundle exec jekyll serve` --
# restart the server after editing it.

title: Fishtown Pickleball Club
email: admin at fishtownpickleball.com
tagline: Since 2021
description: >- # this means to ignore newlines until "baseurl:"
  Recreational pickleball games in the Fishtown neighborhood of Philadelphia.
baseurl: ""
url: "https://fishtownpickleball.com"
theme: minima
logo: assets/logo.png
header_pages:
  - levels.md

# Build settings
plugins:
  - jekyll-feed
  - jekyll-remote-theme

# Front matter defaults.
defaults:
  # Keep the league dashboard out of sitemap.xml. It publishes ~3,000 real
  # people's names and DUPR ratings and is deliberately not indexable, so
  # listing it in a sitemap would invite exactly the crawl that robots.txt and
  # the pages' own noindex meta tags exist to prevent. Jekyll front matter
  # defaults apply to static files too, which is what cpl/ consists of.
  #
  # Inert today: no sitemap plugin is enabled, so nothing generates a sitemap to
  # be excluded from. It is here so that enabling jekyll-sitemap later cannot
  # silently start advertising cpl/ as a side effect.
  - scope:
      path: "cpl"
    values:
      sitemap: false

# Exclude from processing.
#
# Without this, package.json, package-lock.json and eslint.config.mjs were
# served on the live site -- anyone could fetch fishtownpickleball.com/package.json
# and read the script list, the repo URL and the pinned dependency versions.
exclude:
  - .env
  - .github/
  - .jekyll-cache/
  - .sass-cache/
  - _archive/
  - eslint.config.mjs
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules/
  - package.json
  - package-lock.json
  - pickleball-worker/
  - README.md
  - vendor/
