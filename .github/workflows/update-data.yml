# Named for what it does, not for one of its two schedules: this runs every 6
# hours in `due` mode plus a weekly `full` refresh. The old "Weekly" name was an
# actively misleading clue when paging back through ~375 runs a year.
name: CPL Data Refresh

on:
  schedule:
    # Frequent due-only refreshes (every 6 hours).
    - cron: '0 */6 * * *'
    # Weekly full safety refresh (Sunday 9:00 AM UTC).
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: "Refresh mode: due (division-gated) or full (all divisions)"
        required: false
        default: "full"

permissions:
  contents: write

# Only one repo-writing workflow at a time: a slow due-run straddling the
# weekly full run (or a manual dispatch) must queue, not race the git push.
concurrency:
  group: cpl-repo-writes
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Execute Core CPL Engine Pipeline
        id: pipeline
        # The pipeline exits non-zero when any division failed but still writes
        # everything that succeeded; continue so partial data gets committed,
        # then fail the run afterwards.
        continue-on-error: true
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_REFRESH_MODE: ${{ github.event.inputs.refresh_mode }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REFRESH_MODE="${MANUAL_REFRESH_MODE:-full}"
          elif [ "${EVENT_SCHEDULE}" = "0 9 * * 0" ]; then
            REFRESH_MODE="full"
          else
            REFRESH_MODE="due"
          fi
          echo "Running pipeline with refresh mode: ${REFRESH_MODE}"
          # Recorded before the pipeline runs, so the commit step can name the
          # mode even when the pipeline exits non-zero.
          echo "refresh_mode=${REFRESH_MODE}" >> "$GITHUB_OUTPUT"
          # Disable errexit around the pipeline itself: it intentionally exits
          # non-zero on a partial failure (see the comment above), and this
          # step still has to run the lines below that one to surface
          # DIVISIONS_BUILT_JSON — `set -e` would otherwise abort right on the
          # failing line and skip them. ${PIPESTATUS[0]} (not `tee`'s own,
          # always-zero exit code) is what the "Fail run if pipeline reported
          # errors" step further down keys off of, via this step's own exit
          # code restored at the bottom.
          set +e
          if [ "${REFRESH_MODE}" = "due" ]; then
            node _cpl/run-pipeline.js --refresh-mode | tee pipeline.log
          else
            node _cpl/run-pipeline.js | tee pipeline.log
          fi
          PIPELINE_EXIT=${PIPESTATUS[0]}
          set -e
          # run-pipeline.js prints its own name list as one greppable line
          # (see run-pipeline.js's main()) so this step doesn't have to
          # re-derive it from the divisions.json manifests.
          DIVISIONS_JSON=$(grep '^DIVISIONS_BUILT_JSON=' pipeline.log | tail -1 | sed 's/^DIVISIONS_BUILT_JSON=//' || true)
          echo "divisions_json=${DIVISIONS_JSON:-[]}" >> "$GITHUB_OUTPUT"
          # Same greppable-line pattern, used below to decide whether a new
          # player needs a DUPR rating before this run's data is committed —
          # otherwise they'd sit unrated until the next weekly update-dupr.yml
          # cron (see run-pipeline.js's main()).
          NEW_PLAYER_COUNT=$(grep '^NEW_PLAYER_COUNT=' pipeline.log | tail -1 | sed 's/^NEW_PLAYER_COUNT=//' || true)
          echo "new_player_count=${NEW_PLAYER_COUNT:-0}" >> "$GITHUB_OUTPUT"
          exit "${PIPELINE_EXIT}"

      # ci.yml has an equivalent check ("Check committed output matches a
      # fresh compile"), but it never actually runs against these commits:
      # GitHub does not fire push-triggered workflows for a push made with the
      # default GITHUB_TOKEN (the credential actions/checkout wires up here),
      # specifically to prevent workflows from recursively triggering each
      # other. So ci.yml's drift check has only ever run against Tim's own
      # pushes, never against a `due` run's. Recompiling every division from
      # the cache this job just fetched — no network involved, so this is
      # cheap even though `due` mode only refetched a few divisions — makes
      # this run's cpl/ output authoritative (a full recompile, not whatever
      # `due` mode produced), so it's just part of the build rather than a
      # pass/fail gate: whatever compile.js emits here is what gets committed.
      - name: Recompile in full
        run: node _cpl/compile.js

      # A brand-new player always lands in global_players.json with
      # duprRating: null (fetcher.js), so without this they'd show up unrated
      # on the site until update-dupr.yml's own Monday cron caught up — days
      # later for a Tuesday signup. No --bypass-cache (unlike update-dupr.yml):
      # shouldFetchPlayer() already re-fetches anyone with duprRating == null,
      # which is exactly (and only) the new players this run just added, so
      # this step never re-hits the DUPR API for players who were already
      # rated. Invoked directly rather than via `npm run dupr:fetch` because
      # that script's `--env-file=.env` is for local runs only — CI has no
      # .env file and passes the secret through the environment instead, the
      # same way update-dupr.yml's own step does.
      - name: Fetch DUPR ratings for new players
        id: dupr_fetch
        if: steps.pipeline.outputs.new_player_count != '0'
        # Same reasoning as the pipeline step above: a DUPR-side hiccup (rate
        # limit, expired token) must not block the division data this run
        # already fetched from getting committed. Continue, then fail the run
        # afterward.
        continue-on-error: true
        run: node _cpl/fetch-dupr.js
        env:
          DUPR_ACCESS_TOKEN: ${{ secrets.DUPR_ACCESS_TOKEN }}

      - name: Commit and Push changes
        env:
          REFRESH_MODE: ${{ steps.pipeline.outputs.refresh_mode }}
          DIVISIONS_JSON: ${{ steps.pipeline.outputs.divisions_json }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add _cpl/ cpl/
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
            exit 0
          fi
          # The mode decides which divisions were even looked at, so it is the
          # first thing worth knowing when bisecting for the run that broke the
          # site. "weekly" was wrong for 6 of every 7 runs.
          COMMIT_MSG="bot(CPL): Automated data refresh (${REFRESH_MODE:-unknown})"
          # Append the human-readable division names this run actually fetched
          # (e.g. "[3.0, 3.5, 3.25 Womens]"), when there were any — a `due` run
          # that found nothing due, or a step that failed before printing the
          # marker line, leaves this empty/"[]" and the message falls back to
          # what it always said.
          if [ -n "${DIVISIONS_JSON}" ] && [ "${DIVISIONS_JSON}" != "[]" ]; then
            DIVISIONS_LIST=$(node -e "console.log(JSON.parse(process.argv[1]).join(', '))" "${DIVISIONS_JSON}")
            COMMIT_MSG="${COMMIT_MSG} [${DIVISIONS_LIST}]"
          fi
          git commit -m "${COMMIT_MSG}"
          # Another run may have pushed while this one was fetching; rebase and
          # retry rather than failing the push.
          for attempt in 1 2 3; do
            # A rebase that stopped on a conflict leaves .git/rebase-merge behind,
            # which makes every later `git pull --rebase` fail instantly with "a
            # rebase is already in progress" — so attempts 2 and 3 were free
            # no-ops. Clear it first so a retry is a real retry.
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 5
          done
          exit 1

      - name: Fail run if pipeline reported errors
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::The CPL pipeline reported failed divisions — see the pipeline step log."
          exit 1

      - name: Fail run if DUPR fetch for new players failed
        if: steps.dupr_fetch.outcome == 'failure'
        run: |
          echo "::error::Fetching DUPR ratings for new players failed — see the 'Fetch DUPR ratings for new players' step log. The data refresh itself was still committed."
          exit 1

      # Dead man's switch. An `if: failure()` notification can only fire when a
      # run fails, which misses every way this workflow goes quiet:
      #   - green-but-wrong runs that publish empty or stale data,
      #   - runs cancelled or skipped by the cpl-repo-writes concurrency group,
      #   - GitHub disabling the cron entirely after 60 days of repo inactivity.
      # A ping that only ever arrives from a fully successful run turns all three
      # into the same alert: the ping stopped coming.
      # Configure the Healthchecks.io check with period 7h and grace 1h — one
      # tick longer than the 6-hour cron, so a single slow or queued run does not
      # page, but two consecutive misses do.
      - name: Ping healthcheck (dead man's switch)
        if: success()
        env:
          URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$URL" ]; then
            curl -fsS -m 10 --retry 3 "$URL" || true
          else
            echo "HEALTHCHECK_URL secret not set; skipping ping."
          fi
