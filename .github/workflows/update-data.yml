# Named for what it does, not for one of its two schedules: this runs every 6
# hours in `due` mode plus a weekly `full` refresh. The old "Weekly" name was an
# actively misleading clue when paging back through ~375 runs a year.
name: CPL Data Refresh

on:
  schedule:
    # Frequent due-only refreshes (every 6 hours).
    - cron: '0 */6 * * *'
    # Weekly full safety refresh (Sunday 9:00 AM UTC).
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: "Refresh mode: due (division-gated) or full (all divisions)"
        required: false
        default: "full"

permissions:
  contents: write

# Only one repo-writing workflow at a time: a slow due-run straddling the
# weekly full run (or a manual dispatch) must queue, not race the git push.
concurrency:
  group: cpl-repo-writes
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Execute Core CPL Engine Pipeline
        id: pipeline
        # The pipeline exits non-zero when any division failed but still writes
        # everything that succeeded; continue so partial data gets committed,
        # then fail the run afterwards.
        continue-on-error: true
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_REFRESH_MODE: ${{ github.event.inputs.refresh_mode }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REFRESH_MODE="${MANUAL_REFRESH_MODE:-full}"
          elif [ "${EVENT_SCHEDULE}" = "0 9 * * 0" ]; then
            REFRESH_MODE="full"
          else
            REFRESH_MODE="due"
          fi
          echo "Running pipeline with refresh mode: ${REFRESH_MODE}"
          # Recorded before the pipeline runs, so the commit step can name the
          # mode even when the pipeline exits non-zero.
          echo "refresh_mode=${REFRESH_MODE}" >> "$GITHUB_OUTPUT"
          if [ "${REFRESH_MODE}" = "due" ]; then
            node _cpl/run-pipeline.js --refresh-mode
          else
            node _cpl/run-pipeline.js
          fi

      - name: Commit and Push changes
        env:
          REFRESH_MODE: ${{ steps.pipeline.outputs.refresh_mode }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add _cpl/ cpl/
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
            exit 0
          fi
          # The mode decides which divisions were even looked at, so it is the
          # first thing worth knowing when bisecting for the run that broke the
          # site. "weekly" was wrong for 6 of every 7 runs.
          git commit -m "bot(CPL): Automated data refresh (${REFRESH_MODE:-unknown})"
          # Another run may have pushed while this one was fetching; rebase and
          # retry rather than failing the push.
          for attempt in 1 2 3; do
            # A rebase that stopped on a conflict leaves .git/rebase-merge behind,
            # which makes every later `git pull --rebase` fail instantly with "a
            # rebase is already in progress" — so attempts 2 and 3 were free
            # no-ops. Clear it first so a retry is a real retry.
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 5
          done
          exit 1

      - name: Fail run if pipeline reported errors
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::The CPL pipeline reported failed divisions — see the pipeline step log."
          exit 1

      # Dead man's switch. An `if: failure()` notification can only fire when a
      # run fails, which misses every way this workflow goes quiet:
      #   - green-but-wrong runs that publish empty or stale data,
      #   - runs cancelled or skipped by the cpl-repo-writes concurrency group,
      #   - GitHub disabling the cron entirely after 60 days of repo inactivity.
      # A ping that only ever arrives from a fully successful run turns all three
      # into the same alert: the ping stopped coming.
      # Configure the Healthchecks.io check with period 7h and grace 1h — one
      # tick longer than the 6-hour cron, so a single slow or queued run does not
      # page, but two consecutive misses do.
      - name: Ping healthcheck (dead man's switch)
        if: success()
        env:
          URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$URL" ]; then
            curl -fsS -m 10 --retry 3 "$URL" || true
          else
            echo "HEALTHCHECK_URL secret not set; skipping ping."
          fi
