name: Weekly Data Update

on:
  schedule:
    # Frequent due-only refreshes (every 6 hours).
    - cron: '0 */6 * * *'
    # Weekly full safety refresh (Sunday 9:00 AM UTC).
    - cron: '0 9 * * 0'
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: "Refresh mode: due (division-gated) or full (all divisions)"
        required: false
        default: "full"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Core CPL Engine Pipeline
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_REFRESH_MODE: ${{ github.event.inputs.refresh_mode }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REFRESH_MODE="${MANUAL_REFRESH_MODE:-full}"
          elif [ "${EVENT_SCHEDULE}" = "0 9 * * 0" ]; then
            REFRESH_MODE="full"
          else
            REFRESH_MODE="due"
          fi
          echo "Running pipeline with refresh mode: ${REFRESH_MODE}"
          node _cpl/run-pipeline.js --refresh-mode="${REFRESH_MODE}"

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add _cpl/ cpl/
          git diff-index --quiet HEAD || (git commit -m "bot(CPL): Automated weekly dashboard compile" && git push)
