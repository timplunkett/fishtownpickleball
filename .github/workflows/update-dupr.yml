name: Update DUPR Ratings

on:
  workflow_dispatch:

permissions:
  contents: write

# Shares the repo-write lock with the data-update workflow so the two can't
# race each other's git push.
concurrency:
  group: cpl-repo-writes
  cancel-in-progress: false

jobs:
  update-dupr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch DUPR Ratings
        run: node _cpl/fetch-dupr.js --bypass-cache
        env:
          DUPR_ACCESS_TOKEN: ${{ secrets.DUPR_ACCESS_TOKEN }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          # The per-division shards are what dashboard pages actually load, so
          # leaving them out here would publish a ratings update that no
          # dashboard ever sees.
          git add _cpl/data/global_players.json cpl/dupr-ratings.js 'cpl/*/dupr-*.js'
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "bot(DUPR): Update player DUPR ratings"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 5
          done
          exit 1
