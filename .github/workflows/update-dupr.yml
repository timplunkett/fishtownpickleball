name: Update DUPR Ratings

on:
  schedule:
    # Monday 07:00 UTC. Deliberately off every tick of the data workflow's
    # '0 */6 * * *' and its '0 9 * * 0' full refresh: the shared concurrency
    # group would only queue this behind a ~40-minute run for nothing.
    # Without a cron, ratings refreshed only when someone remembered to.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: "Refresh mode: full (every player with a DUPR ID) or due (only players credited with a game in a completed match in the last 7 days)"
        required: false
        default: "full"
      season:
        description: "Optional: restrict to players on a roster (active or sub) for one season slug, e.g. 2026-fall. Leave blank for no restriction."
        required: false
        default: ""

permissions:
  contents: write

# Shares the repo-write lock with the data-update workflow so the two can't
# race each other's git push.
concurrency:
  group: cpl-repo-writes
  cancel-in-progress: false

jobs:
  update-dupr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Fetch DUPR Ratings
        env:
          DUPR_ACCESS_TOKEN: ${{ secrets.DUPR_ACCESS_TOKEN }}
          MANUAL_REFRESH_MODE: ${{ github.event.inputs.refresh_mode }}
          MANUAL_SEASON: ${{ github.event.inputs.season }}
        run: |
          # --bypass-cache always runs: this is the one workflow whose whole
          # job is re-checking ratings, so a cached "already have a rating"
          # would defeat the point even when refresh_mode/season have also
          # narrowed which players are in scope. github.event.inputs.* are
          # unset (empty string) on the scheduled cron trigger, same as
          # update-data.yml's own refresh_mode handling.
          ARGS=(--bypass-cache)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${MANUAL_REFRESH_MODE:-full}" = "due" ]; then
              ARGS+=(--refresh-mode)
            fi
            if [ -n "${MANUAL_SEASON}" ]; then
              ARGS+=("--season=${MANUAL_SEASON}")
            fi
          fi
          echo "Running: node _cpl/fetch-dupr.js ${ARGS[*]}"
          node _cpl/fetch-dupr.js "${ARGS[@]}"

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          # The per-division shards are what dashboard pages actually load, so
          # leaving them out here would publish a ratings update that no
          # dashboard ever sees.
          git add _cpl/data/global_players.json cpl/compiled/dupr-ratings.js 'cpl/*/compiled/dupr-*.js'
          if git diff-index --quiet HEAD; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "bot(DUPR): Update player DUPR ratings"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 5
          done
          exit 1
