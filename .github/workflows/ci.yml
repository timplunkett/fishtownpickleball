name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Compile from cached data (smoke test)
        run: npm run compile

      # Recompiling and discarding the result only proved the compiler doesn't
      # crash. cpl/ is committed and served directly, so if it differs from what
      # _cpl/ data compiles to, the live site is showing output nobody generated
      # from the current inputs.
      - name: Check committed output matches a fresh compile
        run: |
          if ! git diff --exit-code -- cpl/; then
            echo "::error::Committed cpl/ output has drifted from what _cpl/ data compiles to (diff above). Run 'npm run compile' and commit the result."
            exit 1
          fi
